{% extends "network/layout.html" %}

{% block body%}
    <h1>{{user}}</h1>
    <div>
       Followers: {{ followStat.numberFollowers }}
       Following: {{ followStat.numberFollowings }}

        
        <div class="mb-3">
            {% for post in posts %}
            <div class="card col-10">
                <div>User: {{ post.user }}</div>
                <div>{{ post.post }}</div>
                <div>Number of likes: {{post.likes}}</div>
                <div>{{ post.date }}</div>
            </div>
            {% endfor %}
        </div>

        <div>
          
        </div>
       
       
    </div>
{% endblock %}
